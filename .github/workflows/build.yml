name: build-deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: theos build (linux toolchain)
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a
          cat /etc/os-release | head -3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git curl ca-certificates xz-utils \
            libssl-dev libplist-dev libc6-dev binutils \
            dpkg-dev fakeroot python3
          dpkg-deb --version | head -1

      - name: Install ldid
        run: |
          set -euo pipefail
          URL=https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo curl -fsSL "$URL" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -3 || true

      - name: Setup theos + iOS SDK
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          SDK_SRC=$(ls -d /tmp/sdks/iPhoneOS16*.sdk | tail -1)
          echo "using SDK: $SDK_SRC"
          cp -R "$SDK_SRC" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"
          echo "--- toolchain ---"
          ls "$THEOS/toolchain" || true
          ls "$THEOS/toolchain/linux" 2>/dev/null || true
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Prepare layout from base deb
        run: bash ci/prepare-layout.sh

      - name: Build package
        run: |
          set -o pipefail
          make clean 2>&1 | tail -5 || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tee build.log

      - name: Verify deb
        run: bash ci/verify-deb.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: PetDFY-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore