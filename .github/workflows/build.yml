name: build-deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build deb (ubuntu + clang/ld64.lld)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git curl ca-certificates xz-utils unzip \
            libssl-dev libplist-dev libc6-dev binutils \
            dpkg-dev fakeroot python3 \
            clang lld llvm
          echo "--- tools ---"
          which clang ld64.lld llvm-lipo llvm-strip dpkg-deb || true
          clang --version | head -2

      - name: Install ldid
        run: |
          set -euo pipefail
          URL=https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo curl -fsSL "$URL" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -3 || true

      - name: Fetch iOS SDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p sdks
          cp -R "$(ls -d /tmp/sdks/iPhoneOS16*.sdk | tail -1)" sdks/
          ls -1 sdks
          echo "IOS_SDK=$PWD/$(ls -d sdks/iPhoneOS*.sdk | tail -1)" >> "$GITHUB_ENV"

      - name: Build dylib + package deb
        run: |
          set -o pipefail
          bash ci/build-native.sh 2>&1 | tee build.log

      - name: Verify deb
        run: bash ci/verify-deb.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: PetDFY-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore